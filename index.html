<!DOCTYPE html>
<html>
<head>
<title>JM Group and Industry's</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body onload="displayemployees()">
<div class="bg-white opacity-75 rounded-2 p-3" style="width: 80%; margin: 30px auto;">
<div class="bg-primary text-light rounded-2 p-2 text-center">
<h1>JM Group and Industry's</h1>
<p class="lead">Manage employee information and calculate total monthly salaries.</p>
</div>

<div class="table-responsive my-5">
<table class="table table-bordered table-striped">
<thead>
<tr>
<th>Name</th>
<th>Position</th>
<th>Monthly Salary ($)</th>
</tr>
</thead>
<tbody id="employeetable"></tbody>
</table>
</div>
</div>

<!-- Script Tag -->
<script>
const employees = [
    {name: "John Doe", position: "Software Engineer", salary: 5000},
    {name: "Jane Smith", position: "Graphic Designer", salary: 4000},
    {name: "Alice Johnson", position: "Marketing Manager", salary: 6000}
];

function displayemployees(){
    let table = document.getelementById("employeetable");
    table.innerHTML = "";

    for(i=0; i<employees.length; i++){
    table.innerHTML = `
    <tr>
    <td>${employees[i].name}</td>
    <td>${employees[i].position}</td>
    <td>${employees[i].salary}</td>
    </tr>
    `;
    }
}
displayemployees();
</script>
</body>
</html>
